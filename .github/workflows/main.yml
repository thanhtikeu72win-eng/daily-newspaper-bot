name: Daily Newspaper Bot (Manual Backup)

# နေ့စဉ် အလိုအလျောက်ပို့တာကို Render (bot_interactive.py) က လုပ်ပါပြီ။
# ဒီ workflow က Actions → Run workflow ခလုတ်နှိပ်မှ run မည့် backup ဖြစ်သည်။
on:
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests beautifulsoup4

      - name: Run Bot Script
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHANNEL_ID: ${{ secrets.CHANNEL_ID }}
        run: python bot_auto.py
