name: Daily Newspaper Bot

on:
  schedule:
    - cron: '35 23 * * *'   # 06:05 AM Myanmar time
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests beautifulsoup4

      - name: Run Bot Script
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHANNEL_ID: ${{ secrets.CHANNEL_ID }}
        run: python bot_auto.py

      - name: Keepalive Commit
        if: always()
        run: |
          git config user.name "GitHub Action"
          git config user.email "action@github.com"
          git pull --rebase
          git commit --allow-empty -m "keepalive [skip render]"
          git push
